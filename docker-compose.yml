version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     medping
      POSTGRES_PASSWORD: medping
      POSTGRES_DB:       medping
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medping']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: node scripts/migrate.js
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seed:
    build: .
    command: node scripts/seed.js
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
      - seed
    restart: 'no'

  web:
    build: .
    restart: unless-stopped
    command: node src/app.js
    ports:
      - '3000:3000'
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: node src/queues/reminderWorker.js
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
